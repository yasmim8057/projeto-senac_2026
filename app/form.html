<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajei: Sobre</title>
  <link rel="stylesheet" href="./style/form.css">
  <script type="module" src="./scripts/form.js"></script>
</head>

<body>
  <div id="container">
    <header>
      <nav>
        <img src="./images/logo.png"
          alt="Uma imagem de um barco a vela, somente com traços em tons marrons. O barco está de com a proa virada para o lado direito" />
        <div class="toggle"></div>
        <a class="link-do-cabecalho" href="./index.html">Viajei</a>
        <a class="link-do-cabecalho" href="./about.html">Sobre</a>
        <a class="link-do-cabecalho" href="./form.html">Fofoca?!</a>
      </nav>
    </header>

    <main>
      <form id="post-form">
        <label for="autor"> Autor (ex: Yasmim rodrigues): </label>
        <input id="autor" type="text" name="autor" placeholder="Yasmim rodrigues">

        <label for="titulo"> Título da história: </label>
        <input id="titulo" type="text" name="titulo" placeholder="A vida é carnaval">

        <label for="email"> Email: </label>
        <input id="email" type="email" name="email" placeholder="yasmim.rodrigues040609@gmail.com">
        
        <label for="historia">Historia: </label>
        <textarea id="história" cols="50" rows="20" name="historia"
          placeholder="Minha vida, nem sempre foi festa, mas coração sempre foi carnaval..."></textarea>

        <button type="submit"> Enviar </button>

      </form>
    </main>

    <dialog id="modal">
      <button autofocus>Fechar</button>
      <div id="modal-content"></div>
    </dialog>

    <footer>
      <div id="historias">

      </div>
    </footer>
  </div>
</body>

</html>
